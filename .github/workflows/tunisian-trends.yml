name: PUNIX Tunisian streaming trends

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tunisian-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect platform snapshots and calculate trends
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_tunisian_trends.py
      - name: Commit updated public trend data
        run: |
          if git diff --quiet -- data/tunisian-trends.json; then
            echo "No trend data changes."
            exit 0
          fi
          git config user.name "PUNIX Trend Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tunisian-trends.json
          git commit -m "Update Tunisian streaming trend data"
          git push
