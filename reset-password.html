    <img src="assets/images/punix-logo-original.png" alt="PUNIX">

<main class="auth-shell">
  <a class="auth-brand" href="index.html" aria-label="PUNIX home"><img src="assets/images/punix-logo-original.png" alt="PUNIX" onerror="this.style.display='none'"><span class="brand-wordmark">PUNIX</span></a>
  <section class="auth-card">
    <p class="eyebrow">PUNIX NETWORK / ACCOUNT SECURITY</p>
    <h1>SET A NEW<br><span>PASSWORD.</span></h1>
    <p class="auth-intro">Choose a new password for your PUNIX account.</p>
    <form id="reset-password-form">
      <label>NEW PASSWORD<input id="new-password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></label>
      <label>CONFIRM NEW PASSWORD<input id="confirm-password" type="password" minlength="8" autocomplete="new-password" placeholder="Enter it again" required></label>
      <button class="button auth-submit" id="reset-submit" type="submit">SAVE NEW PASSWORD <span>↗</span></button>
      <p id="reset-message" class="auth-message" role="status" aria-live="polite"></p>
    </form>
    <a class="auth-back" href="auth.html">← BACK TO LOG IN</a>
  </section>
</main>
