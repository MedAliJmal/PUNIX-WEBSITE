<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">PUNIX story placeholder</title><desc id="desc">A dark red and charcoal editorial placeholder for PUNIX news cards.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b22"/><stop offset=".55" stop-color="#090b10"/><stop offset="1" stop-color="#241017"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#e31837" stop-opacity=".28"/><stop offset="1" stop-color="#e31837" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
 <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2949"/><stop offset="1" stop-color="#a90d2b"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
<circle cx="930" cy="160" r="360" fill="url(#glow)"/>
<path d="M0 520 390 0h170L170 675H0Z" fill="#fff" opacity=".025"/>
<path d="M900 0h110L650 675H540Z" fill="#fff" opacity=".035"/>
<g fill="none" stroke="#f1f2f3" stroke-opacity=".17">
 <circle cx="600" cy="315" r="205" stroke-width="1.5"/><circle cx="600" cy="315" r="170" stroke-width="1"/>
 <path d="M600 76v55M600 499v55M361 315h55M784 315h55" stroke-width="2"/>
</g>
<path d="m500 410 190-260h82L581 410Z" fill="url(#slash)" opacity=".95"/>
<path d="m642 410 95-130h70l-95 130Z" fill="#f3f4f5" opacity=".9"/>
