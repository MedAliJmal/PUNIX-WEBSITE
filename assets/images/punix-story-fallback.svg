<text x="600" y="575" text-anchor="middle" fill="#f5f5f5" font-family="Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="9">PUNIX</text>
<text x="600" y="608" text-anchor="middle" fill="#c1c4ca" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="5">STORY / NEWS / UPDATES</text>
